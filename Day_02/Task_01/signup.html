<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signup - MyWebsite</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="logo">MyWebsite</div>
      <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
      </nav>
    </div>
  </header>

  <main class="page-wrapper">
    <div class="two-col">

      <div class="col-left">
        <img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=600" alt="illustration">
      </div>

      <div class="col-right">
        <div class="form-card">
          <h1>Create Account</h1>
          <form>
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Enter your name" required>
            <small></small>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>
            <small></small>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" minlength="8" required>
            <small></small>

            <label for="confirm-password">Confirm Password</label>
            <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm your password" minlength="8" required>
            <small></small>

            <button type="submit">Create Account</button>
          </form>
          <p class="switch-link">Already have an account? <a href="index.html">Login</a></p>
        </div>
      </div>

    </div>
  </main>

</body>
</html>
