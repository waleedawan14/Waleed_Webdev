<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - MyWebsite</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="logo">MyWebsite</div>
      <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
      </nav>
    </div>
  </header>

  <main class="page-wrapper">
    <div class="two-col">

      <div class="col-left">
        <img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=600" alt="illustration">
      </div>

      <div class="col-right">
        <div class="form-card">
          <h1>Login</h1>
          <form>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" minlength="8" required>

            <button type="submit">Login</button>
          </form>
          <p class="switch-link">Don't have an account? <a href="signup.html">Signup</a></p>
        </div>
      </div>

    </div>
  </main>

  <footer>
    <div class="footer-inner">
      <div class="footer-col">
        <h3>MyWebsite</h3>
        <p>Building great things for the web.</p>
      </div>
      <div class="footer-col">
        <h4>Quick Links</h4>
        <ul>
          <li><a href="#">Home</a></li>
          <li><a href="#">About</a></li>
          <li><a href="#">Contact</a></li>
        </ul>
      </div>
      <div class="footer-col">
        <h4>Newsletter</h4>
        <p>Subscribe to get updates.</p>
        <div class="newsletter">
          <input type="email" placeholder="Your email">
          <button>Subscribe</button>
        </div>
      </div>
    </div>
  </footer>

</body>
</html>
